# ---------------------------------------------------------------------------
# Bright Future Grant — app + Cloudflare Tunnel
#
# 1. Copy .env.example to .env and fill in SECRET_KEY, ADMIN_* and
#    CLOUDFLARE_TUNNEL_TOKEN.
# 2. Run:  docker compose up -d --build
#
# The Flask app listens on port 8080 inside the compose network; cloudflared
# publishes it to your Cloudflare domain over an outbound-only tunnel (no
# inbound ports need to be opened on the host).
# ---------------------------------------------------------------------------
services:
  brightpath:
    build: .
    image: brightpath:latest
    restart: unless-stopped
    env_file: .env
    environment:
      BRIGHTPATH_DATA_DIR: /data
      PORT: "8080"
    volumes:
      - brightpath-data:/data
    expose:
      - "8080"
    # Uncomment to reach the app directly on the host for local testing:
    # ports:
    #   - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - brightpath

volumes:
  brightpath-data:
